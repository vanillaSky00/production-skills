# /etc/deploy-secrets.conf
#
# Per-host configuration for install-secret. This is the ONLY file you edit per project.
# The install-secret script itself is generic and identical on every host.
#
#   sudo install -m 0644 -o root -g root deploy-secrets.conf /etc/deploy-secrets.conf
#
# install-secret refuses to run if this file is not root-owned or is group/world
# writable — the allowlist below is what stops the sudo grant from becoming a
# write-anywhere primitive, so the file's own permissions are load-bearing.
#
# Format:
#   secret_dir = <absolute path>          default directory for entries with no dir column
#   <name>       <uid:gid>      [dir]     one line per secret
#
# The name column is an ALLOWLIST. install-secret rejects any name not listed here, so
# adding a service is a deliberate, root-level act rather than something a workflow can do.
#
# The uid:gid column must be the UID the CONTAINER runs as, not the runner's UID. A
# Compose file-backed secret is a bind mount, and bind mounts carry host uid/gid into the
# container — a non-root container cannot read another user's 0600 file. Find it with:
#
#   docker compose exec <service> id

secret_dir = /etc/myapp/secrets

# name                    owner          dir (optional)
# ----------------------  -------------  ----------------------------
db_password               10001:10001
api_token                 10001:10001

# Multiple projects on one host: give each its own directory. Names stay unique
# across the whole file, so prefix them by project.
#
# projectb_db_password    10002:10002    /etc/projectb/secrets
# projectb_s3_secret_key  10002:10002    /etc/projectb/secrets

# Whole-pgpass-line variant (see the compose template, Shape B):
# pgpass                  10001:10001
